name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.3)'
        required: false
        type: string
        default: '1.0.3'
      create_release:
        description: 'Create or update GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v${{ inputs.version || '1.0.3' }}"
          fi
          # Produce both version-tagged and canonical APKs
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/Radian-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/Radian.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Radian-Android-APK
          path: release-assets/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version || '1.0.2') }}
          name: Radian Android Release ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version || '1.0.2') }}
          files: release-assets/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true

